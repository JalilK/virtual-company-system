name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: test
        run: python -m pytest
      - name: validate scaffold
        run: |
          vc init ci_company
          vc validate ci_company
